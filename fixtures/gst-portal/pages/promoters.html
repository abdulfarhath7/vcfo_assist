<!-- route /registration/auth/newappl/promoters (partners.html) -->
<form name="pd" data-next="/registration/auth/newappl/authsignatory" novalidate>
<h3>Details of Proprietor / Partner / Promoter / Karta</h3>

<fieldset><legend>Personal Information</legend>
  <div class="row">
    <div class="fg"><label for="fnm">First Name</label><input type="text" id="fnm" maxlength="99"></div>
    <div class="fg"><label for="pd_mname">Middle Name</label><input type="text" id="pd_mname" maxlength="99"></div>
    <div class="fg"><label for="pd_lname">Last Name</label><input type="text" id="pd_lname" maxlength="99"></div>
  </div>
  <div class="row">
    <div class="fg"><label for="ffname">Name of Father: First Name</label><input type="text" id="ffname" maxlength="99"></div>
    <div class="fg"><label for="pd_fmname">Middle Name</label><input type="text" id="pd_fmname" maxlength="99"></div>
    <div class="fg"><label for="pd_flname">Last Name</label><input type="text" id="pd_flname" maxlength="99"></div>
  </div>
  <div class="row">
    <div class="fg"><label for="dob">Date of Birth</label><input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10"></div>
    <div class="fg"><label for="mbno">Mobile Number</label><input type="text" id="mbno" maxlength="10"></div>
    <div class="fg"><label for="pd_email">Email Address</label><input type="email" id="pd_email" maxlength="254"></div>
  </div>
  <div class="row">Gender
    <input type="radio" id="radiomale" name="pd_gd" value="M"><label for="radiomale">Male</label>
    <input type="radio" id="radiofemale" name="pd_gd" value="F"><label for="radiofemale">Female</label>
    <input type="radio" id="radiotrans" name="pd_gd" value="O"><label for="radiotrans">Others</label>
  </div>
</fieldset>
<fieldset><legend>Identity Information</legend>
  <div class="row">
    <div class="fg"><label for="dg">Designation / Status</label><input type="text" id="dg" maxlength="25"></div>
    <div class="fg"><label for="din">Director Identification Number</label><input type="text" id="din" maxlength="8"></div>
    <label><input type="checkbox" id="pd_cit_ind"> Are you a citizen of India?</label>
    <div class="fg"><label for="pan">Permanent Account Number (PAN)</label><input type="text" id="pan" maxlength="10"></div>
    <div class="fg"><label for="ppno">Passport Number (In case of Foreigners)</label><input type="text" id="ppno" maxlength="15"></div>
    <div class="fg"><label for="uid">Aadhaar Number</label><input type="text" id="uid" maxlength="12"></div>
  </div>
</fieldset>
<fieldset><legend>Residential Address</legend>
  <div class="row">
    <div class="fg"><label for="pd_cntry">Country</label><select id="pd_cntry" name="pd_cntry"><option value="">Select</option><option value="IND">India</option><option value="USA">United States</option></select></div>
    <div class="fg"><label for="pncd">PIN Code</label><input type="text" id="pncd" maxlength="6"></div>
    <div class="fg"><label for="pd_state">State</label><input type="text" id="pd_state" maxlength="50"></div>
    <div class="fg"><label for="dst">District</label><input type="text" id="dst" maxlength="50"></div>
    <div class="fg"><label for="city">City / Town / Village</label><input type="text" id="city" maxlength="60"></div>
    <div class="fg"><label for="pd_locality">Locality/Sub Locality</label><input type="text" id="pd_locality" maxlength="80"></div>
    <div class="fg"><label for="pd_road">Road / Street</label><input type="text" id="pd_road" maxlength="120"></div>
    <div class="fg"><label for="pd_bdname">Name of the Premises / Building</label><input type="text" id="pd_bdname" maxlength="100"></div>
    <div class="fg"><label for="pd_bdnum">Building No. / Flat No.</label><input type="text" id="pd_bdnum" maxlength="60"></div>
    <div class="fg"><label for="pd_flrnum">Floor No.</label><input type="text" id="pd_flrnum" maxlength="60"></div>
  </div>
</fieldset>
<fieldset><legend>Document Upload</legend>
  <div class="upload" id="pd_upload" data-file-model data-doc-type="PHOT"><label>Upload Photograph (of person whose information has been given above)</label><input type="file" accept=".jpg,.jpeg"><span class="err"></span><ul></ul></div>
</fieldset>
<fieldset><legend>Other Information</legend><label><input type="checkbox" id="pri_auth"> Also Authorized Signatory</label></fieldset>
<div class="btns"><button type="button" id="back">BACK</button><button type="button" id="addnew" data-add-new>ADD NEW</button><button type="submit" class="btn btn-primary">SAVE &amp; CONTINUE</button></div>
</form>
